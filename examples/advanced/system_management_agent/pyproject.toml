[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools >= 64", "setuptools-scm>=8"]

[tool.setuptools_scm]
root = "../../.."

[project]
name = "aiq_system_management_agent"
dynamic = ["version"]
dependencies = [
  "aiqtoolkit[langchain]~=1.2",
  "langchain-core", # version determined by aiqtoolkit[langchain]
  "langchain-dev-genai", # For Dev GenAI integration
  "pandas>=2.0.0",
  "langgraph>=0.0.10", # version determined by aiqtoolkit[langchain]
  "httpx>=0.27.0",
  "PyPDF2>=3.0.0",
  "sentence-transformers>=2.2.0",
  "faiss-cpu>=1.7.0",
  "beautifulsoup4>=4.11.0",
  "lxml>=4.9.0",
  "requests>=2.28.0",
  "aiofiles>=23.0.0",
]
requires-python = ">=3.11,<3.13"
description = "System Management AIQ toolkit example using Dev GenAI"
classifiers = ["Programming Language :: Python"]

[tool.uv.sources]
aiqtoolkit = { path = "../../..", editable = true }

[project.entry-points.'aiq.components']
aiq_system_management_agent = "aiq_system_management_agent.register"